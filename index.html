<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Cabin Narrative</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="train-cabin">
        <canvas id="scene" width="1600" height="900"></canvas>

        <!-- Dialogue Interface (Left-aligned) -->
        <div id="dialogue-interface">
            <div class="dialogue-content">
                <p id="narrative-text" class="narrative-text">This cabin has collapsed into darkness</p>
                <p id="question-text" class="question-text"></p>

                <div id="choices-container" class="choices-container hidden">
                    <!-- Choices will be dynamically inserted here -->
                </div>

                <button id="continue-btn" class="continue-btn">Continue</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
