<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Cabin - Interactive Narrative</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Train Cabin Scene -->
        <div id="train-cabin">
            <!-- Background and atmosphere -->
            <div class="atmosphere-overlay"></div>

            <!-- Windows - Left Side -->
            <div class="window-row left-windows">
                <div class="window"></div>
                <div class="window"></div>
                <div class="window"></div>
                <div class="window"></div>
            </div>

            <!-- Windows - Right Side -->
            <div class="window-row right-windows">
                <div class="window"></div>
                <div class="window"></div>
                <div class="window"></div>
                <div class="window"></div>
            </div>

            <!-- Ceiling with lights -->
            <div class="ceiling-section">
                <div class="ceiling-light"></div>
                <div class="ceiling-light"></div>
                <div class="ceiling-light"></div>
                <div class="ceiling-light"></div>
                <div class="ceiling-light"></div>
                <div class="ceiling-light"></div>
                <div class="ceiling-panel center-panel"></div>
            </div>

            <!-- Floor/Aisle -->
            <div class="floor-aisle"></div>

            <!-- Passenger Silhouettes -->
            <div class="passengers">
                <!-- Left side passengers -->
                <div class="passenger left-side p-1" data-seat="left-1">
                    <div class="passenger-head"></div>
                    <div class="passenger-body"></div>
                </div>
                <div class="passenger left-side p-2" data-seat="left-2">
                    <div class="passenger-head"></div>
                    <div class="passenger-body"></div>
                </div>

                <!-- Center passengers -->
                <div class="passenger center p-3" data-seat="center-1">
                    <div class="passenger-head"></div>
                    <div class="passenger-body"></div>
                </div>
                <div class="passenger center p-4" data-seat="center-2">
                    <div class="passenger-head"></div>
                    <div class="passenger-body"></div>
                </div>

                <!-- Right side passengers -->
                <div class="passenger right-side p-5" data-seat="right-1">
                    <div class="passenger-head"></div>
                    <div class="passenger-body"></div>
                </div>
                <div class="passenger right-side p-6" data-seat="right-2">
                    <div class="passenger-head"></div>
                    <div class="passenger-body"></div>
                </div>
            </div>

            <!-- Door/End of cabin -->
            <div class="cabin-door"></div>

            <!-- Flame elements (hidden initially) -->
            <div class="flames-container">
                <div class="flame flame-1"></div>
                <div class="flame flame-2"></div>
                <div class="flame flame-3"></div>
                <div class="flame flame-4"></div>
            </div>
        </div>

        <!-- Dialogue Interface (Left-aligned) -->
        <div id="dialogue-interface">
            <div class="dialogue-content">
                <p id="narrative-text" class="narrative-text">This cabin has collapsed into darkness</p>
                <p id="question-text" class="question-text"></p>

                <div id="choices-container" class="choices-container hidden">
                    <!-- Choices will be dynamically inserted here -->
                </div>

                <button id="continue-btn" class="continue-btn">Continue</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
